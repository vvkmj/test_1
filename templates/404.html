{% extends "base.html" %}

{% block title %}Page Not Found - CraveDrop{% endblock %}

{% block content %}
<div class="error-page-wrapper">
    <div class="error-box">
        <div class="error-emoji">🍕❌</div>
        <h1>404 - Not Found</h1>

        <a href="/" class="btn-primary">Return to Food Menu</a>
    </div>
</div>
{% endblock %}
